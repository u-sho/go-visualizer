name: Lint Check
on:
  pull_request
  push:
    branches: [main]
jobs:
  lint:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - run: npx oxfmt --check
      - run: npm run lint
