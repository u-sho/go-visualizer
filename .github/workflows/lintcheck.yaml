name: Lint Check
on: [push]
jobs:
  lint:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'
      - run: npm ci
      - run: npx oxfmt --check
      - run: npx oxlint
